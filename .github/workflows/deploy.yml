name: Deploy StarHub Best Advance to All Mirrors + Keep-Alive - Universal Free - Owner Not Stress - Future Proof Never Lower

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

concurrency:
  group: starhub-deploy
  cancel-in-progress: false

jobs:
  deploy-primary:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages - Generic Safe
        if: ${{ secrets.CF_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PROJECT_NAME || 'starhub' }}
          directory: .

      - name: Deploy to Vercel - Auto Generic - Best Advance
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@latest
          vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
          echo "Vercel Deployed - framework null auto fix - 404 gone - Free basis"

      - name: Deploy to Firebase - Generic Safe
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'starhubigdp' }}

      - name: Deploy to Surge - Generic Safe
        if: ${{ secrets.SURGE_TOKEN != '' }}
        run: |
          npm install -g surge
          surge . ${{ secrets.SURGE_DOMAIN || 'starhub-eta.surge.sh' }} --token ${{ secrets.SURGE_TOKEN }}
          echo "Surge Deployed - Generic"

      - name: Deploy to Render - Hook - Generic Safe
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" --max-time 15 || echo "Render Hook skip - Safe - Auto toggle ON - Owner not stress"

  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping sleeps:true hosts - Need basis only - Save 5x power - Adaptability Availability
        run: |
          python3 -c "
          import re, urllib.request, os
          print('=== Best Advance Final - Free Basis - Owner Not Stress - All Mirrors ===')
          # Old best logic - Parse DOMAINS sleeps:true from index.html - Real auto
          text=''
          try:
            text=open('index.html',encoding='utf-8',errors='ignore').read()
          except: pass
          m=re.search(r'const DOMAINS\s*=\s*\[(.*?)\n\];',text,re.S) if text else None
          urls=[]
          if m:
            block=m.group(1)
            for obj in re.findall(r'\{([^}]+)\}',block):
              if 'sleeps:true' not in obj.replace(' ',''): continue
              u=re.search(r'pingUrl\s*:\s*[\"']([^\"']+)[\"']',obj) or re.search(r'url\s*:\s*[\"']([^\"']+)[\"']',obj)
              if u: urls.append(u.group(1))
          # New best fallback - Need basis only - Render + Gofile not 8 domains - Save 5x power
          if not urls:
            urls=[
              'https://starhubigdp.onrender.com/ping.txt',
              'https://starhubigdp.vercel.app/public/ping.txt',
              'https://starhubigdp.vercel.app/ping.txt',
              'https://starhubigdp.pages.dev/ping.txt'
            ]
          print(f'Ping {len(urls)} URLs - Need basis only - Save 5x power')
          for url in urls:
            try:
              urllib.request.urlopen(url,timeout=15).read(50)
              print(f'OK Free - {url} - Power not lower')
            except Exception as e:
              print(f'SKIP Free - {url} - Auto toggle ON - Safe - Owner not stress - {e}')
          print('Free basis - No transaction - Auto organised - Future proof never lower - Icon GitHub main - All mirrors best')
          "