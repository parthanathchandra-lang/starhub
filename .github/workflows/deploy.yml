name: StarHub LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: write
  pages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp index.html 404.html || true
      - run: bash -c 'touch.nojekyll'
      - name: Deploy Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: '.'
          branch: gh-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g surge
      - run: bash -c 'surge./ --domain starhub-eta.surge.sh --token ${{ secrets.SURGE_TOKEN }}'
