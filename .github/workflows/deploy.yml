name: Deploy StarHub to All Mirrors + Keep-Alive

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

concurrency:
  group: starhub-deploy
  cancel-in-progress: false

jobs:
  deploy-primary:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CF_API_TOKEN != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PROJECT_NAME || 'starhub' }}
          directory: .

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          npm i -g vercel@latest
          vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Firebase
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID || 'starhubigdp' }}

      - name: Deploy to Surge
        if: ${{ secrets.SURGE_TOKEN != '' }}
        run: |
          npm install -g surge
          surge . ${{ secrets.SURGE_DOMAIN || 'starhub-eta.surge.sh' }} --token ${{ secrets.SURGE_TOKEN }}

      - name: Deploy to Render - Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" --max-time 15 || echo "skip"

  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping sleeps:true hosts - Need basis only
        run: |
          python3 -c "
          import re, urllib.request
          text=open('index.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'const DOMAINS\s*=\s*\[(.*?)\n\];',text,re.S)
          urls=[]
          if m:
            block=m.group(1)
            for obj in re.findall(r'\{([^}]+)\}',block):
              if 'sleeps:true' not in obj.replace(' ',''): continue
              u=re.search(r'pingUrl\s*:\s*[\"']([^\"']+)[\"']',obj) or re.search(r'url\s*:\s*[\"']([^\"']+)[\"']',obj)
              if u: urls.append(u.group(1))
          if not urls:
            urls=['https://starhubigdp.onrender.com/ping.txt']
          print(f'Ping {urls}')
          for url in urls:
            try:
              urllib.request.urlopen(url,timeout=15).read(50)
              print(f'OK {url}')
            except Exception as e:
              print(f'FAIL {url} {e}')
          "