name: StarHub Auto LIVE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix
        run: |
          cp index.html 404.html || true
          touch.nojekyll
          ls -la
      - name: Deploy Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder:.
          branch: gh-pages
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Deploy Surge
        run: |
          npm i -g surge
          surge./ --domain starhub-eta.surge.sh --token ${{ secrets.SURGE_TOKEN }}
