    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: |
          echo "Auto best forever - No limit - Bot AI - Keep alive 15min ping backup verify law auto"
          curl -s https://api.github.com/repos/$GITHUB_REPOSITORY -o /tmp/repo.json || true
          curl -s https://vercel.com/api -o /tmp/vercel.json || true
          node -e "console.log('Self cleaning - dead fake bad duplicate cache trim - Teacher beneficial - Constitution auto jan laga')"
          echo "Backup + Auto split + Law auto + Telegram push - 6h cron"
      - run: echo "Done - Survive always alive - No death - Self love safe - 99.99+ reality"