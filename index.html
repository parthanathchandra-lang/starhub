<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>STARHUB V12</title>
<style>:root{--b:#1a73e8;--l:#e8eaed}*{box-sizing:border-box;margin:0;padding:0}body{font:14px Roboto,sans-serif;padding-bottom:68px;background:#fff}.h{position:sticky;top:0;z-index:9;background:#fff;padding:8px 12px;display:flex;gap:8px}.s{flex:1;height:48px;background:#f1f3f4;border-radius:24px;display:flex;align-items:center;padding:0 12px;gap:8px}.s input{flex:1;border:0;background:0;outline:0}.tabs{display:flex;gap:20px;padding:0 12px;border-bottom:1px solid var(--l);overflow:auto;position:sticky;top:56px;background:#fff}.tabs span{padding:10px 2px;border-bottom:2px solid transparent;white-space:nowrap;color:#5f6368;cursor:pointer}.tabs.on{color:var(--b);border-color:var(--b);font-weight:600}.sec{padding:12px}.row{display:flex;gap:10px;overflow:auto}.row::-webkit-scrollbar{display:none}.c{min-width:108px;width:108px;cursor:pointer}.c img{width:108px;height:108px;border-radius:20px}.n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r{font-size:10px;color:#5f6368;background:#f1f3f4;border-radius:8px;padding:1px 4px;display:inline-block}.chip{font-size:9px;background:#e8f0fe;color:#1967d2;padding:2px 6px;border-radius:10px;display:inline-block;margin:1px}.btm{position:fixed;bottom:0;left:0;right:0;height:60px;background:#f1f3f4;display:flex;justify-content:space-around;align-items:center}.b{font-size:11px;color:#5f6368;display:flex;flex-direction:column;align-items:center;cursor:pointer}.b.on{color:var(--b)}.fr{width:100%;height:64vh;border:0;background:#000;border-radius:12px}.sb{position:absolute;top:52px;left:12px;right:12px;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none;z-index:20}.si{padding:10px 12px;border-bottom:1px solid #f1f3f4;cursor:pointer}</style>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.5.0/dist/fuse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/minisearch@7.2.0/dist/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lunr@2.3.9/lunr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flexsearch@0.8.212/dist/flexsearch.bundle.min.js"></script>
</head><body>
<div class="h"><div class="s">🔍<input id="q" placeholder="Search Games" oninput="sug()" onfocus="sug()">🎤<b style="background:var(--b);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center">P</b><div id="sbx" class="sb"></div></div></div>
<div class="tabs" id="tt"><span class="on" data-t="for">For you</span><span data-t="top">Top</span><span data-t="kid">Kids</span><span data-t="cat">Categories</span></div>
<div id="for" class="sec"><b>Suggested</b><div class="row" id="sr"></div><div style="margin-top:12px"><b>Recommended</b><div class="row" id="rr"></div></div></div>
<div id="top" class="sec" style="display:none"><div class="row" id="tr2"></div></div>
<div id="kid" class="sec" style="display:none"><div class="row" id="kr"></div></div>
<div id="cat" class="sec" style="display:none"><span class="chip" onclick="go('Action')">Action</span><span class="chip" onclick="go('MOBA')">MOBA</span><span class="chip" onclick="go('Shooter')">Shooter</span></div>
<div id="det" class="sec" style="display:none"></div>
<div id="pl" class="sec" style="display:none"><iframe id="fr" class="fr" allow="autoplay;fullscreen" sandbox="allow-scripts allow-same-origin allow-popups"></iframe><div id="pi"></div></div>
<div class="btm"><div class="b" data-n="games">🎮Games</div><div class="b on" data-n="apps">⊞Apps</div><div class="b" data-n="search">🔍Search</div><div class="b" data-n="you">👤You</div></div>
<script>
// --- BASE DATA - Never fails - Even if GitHub deleted ---
let D=[
{id:'pkm',n:'Pokémon UNITE',d:'The Pokémon Co',r:'4.4',c:'MOBA',pf:['Android','PC'],u:'https://now.gg/apps/the-pokemon-company/5947/pokemon-unite.html',i:'https://picsum.photos/seed/pkm/108/108'},
{id:'ff',n:'Free Fire',d:'Garena',r:'4.5',c:'Action',pf:['Android','PC'],u:'https://now.gg/apps/garena/13982/free-fire.html',i:'https://picsum.photos/seed/ff/108/108'},
{id:'rb',n:'Roblox',d:'Roblox Corp',r:'4.7',c:'Action',pf:['PC'],u:'https://now.gg/apps/roblox-corporation/5734/roblox.html',i:'https://picsum.photos/seed/rb/108/108'},
{id:'mc',n:'Minecraft Trial',d:'Mojang',r:'4.4',c:'Strategy',pf:['PC'],u:'https://now.gg/apps/mojang/2534/minecraft-trial.html',i:'https://picsum.photos/seed/mc/108/108'}
];
let REMOTE={toggles:{},env:{}}; let TG={github:true,freetogame:true,rawg:false};
// --- 1. REMOTE CONFIG FROM GITHUB - Auto Toggles ---
async function loadRemote(){
 try{
  let r=await fetch('https://raw.githubusercontent.com/parthanathchandra-lang/starhub/main/config.json?v='+Date.now());
  if(r.ok){ REMOTE=await r.json(); localStorage.setItem('remote_bk',JSON.stringify(REMOTE)); }
 }catch{ try{ REMOTE=JSON.parse(localStorage.getItem('remote_bk')||'{}'); }catch{} }
 let h=location.hostname; let found=null;
 for(let k in (REMOTE.toggles||{})){ if(h.includes(k)) found=REMOTE.toggles[k]; }
 TG=found||{github:true,freetogame:true,rawg:false,ads:true};
 console.log('🌐',h,'TG',TG,'LIVE',REMOTE.live);
}
let miniSearch,fuse,lunrIdx,flexIdx;
function initAllSearch(){
 try{
  miniSearch=new MiniSearch({fields:['n','d','c','pf'],storeFields:['id','n','d','r','c','pf','u','i'],searchOptions:{prefix:true,fuzzy:0.2}}); miniSearch.addAll(D);
  fuse=new Fuse(D,{keys:['n','d','c'],threshold:0.3});
  lunrIdx=lunr(function(){this.ref('id');this.field('n');this.field('d');this.field('c'); D.forEach(d=>this.add(d));});
  flexIdx=new FlexSearch.Document({document:{id:'id',index:['n','d','c']}}); D.forEach(d=>flexIdx.add(d));
 }catch{}
}
function autoSearch(q){
 if(!q) return D; q=q.toLowerCase().trim(); if(!q) return D;
 try{let r=miniSearch.search(q); if(r.length) return r.map(x=>D.find(d=>d.id===x.id)||x);}catch{}
 try{let r=fuse.search(q); if(r.length) return r.map(x=>x.item);}catch{}
 try{let r=flexIdx.search(q,{enrich:true}); if(r&&r.length){let ids=[...new Set(r.flatMap(x=>x.result.map(y=>y.id)))]; if(ids.length) return ids.map(id=>D.find(d=>d.id===id)).filter(Boolean);}}catch{}
 try{let r=lunrIdx.search(q); if(r.length) return r.map(x=>D.find(d=>d.id===x.ref)).filter(Boolean);}catch{}
 return D.filter(o=>o.n.toLowerCase().includes(q)||o.c.toLowerCase().includes(q));
}
async function loadReal(){
 if(TG.github){
  try{
   let url = location.hostname.includes('pages.dev')? '/api/games' : 'https://raw.githubusercontent.com/parthanathchandra-lang/starhub/main/games.json';
   let r=await fetch(url); if(r.ok){
    let j=await r.json();
    let mapped=j.map? j.map(g=>({id:g.id||'ftg_'+g.id,n:g.title||g.n,d:g.publisher||g.d,r:'4.5',c:g.genre||g.c||'Action',pf:['PC'],u:g.game_url||g.u,i:g.thumbnail||g.i})) : j;
    let ids=new Set(D.map(x=>x.id)); D=[...D,...mapped.filter(x=>!ids.has(x.id))];
   }
  }catch{}
 }
 if(TG.freetogame &&!location.hostname.includes('pages.dev')){
  try{
   let r=await fetch('https://www.freetogame.com/api/games?sort-by=popularity');
   if(r.ok){ let j=await r.json(); let mp=j.slice(0,80).map(g=>({id:'ftg_'+g.id,n:g.title,d:g.publisher,r:'4.5',c:g.genre,pf:['PC'],u:g.game_url,i:g.thumbnail})); let ids=new Set(D.map(x=>x.id)); D=[...D,...mp.filter(x=>!ids.has(x.id))]; }
  }catch{}
 }
 if(TG.rawg){
  let key=localStorage.getItem('rawg_key')||''; if(key){ try{let r=await fetch(`https://api.rawg.io/api/games?key=${key}&page_size=20`); let j=await r.json(); let mp=j.results.map(g=>({id:'rawg_'+g.id,n:g.name,d:'Game',r:'4.5',c:g.genres?.[0]?.name||'Action',pf:['PC'],u:`https://rawg.io/games/${g.slug}`,i:g.background_image})); let ids=new Set(D.map(x=>x.id)); D=[...D,...mp.filter(x=>!ids.has(x.id))];}catch{} }
 }
 initAllSearch(); render();
}
let e=s=>String(s).replace(/&/g,'&amp;');
let card=o=>`<div class="c" data-id="${o.id}"><img src="${o.i}" loading="lazy"><div class="n">${e(o.n)}</div><div class="r">${o.r}★</div></div>`;
let render=()=>{document.getElementById('sr').innerHTML=D.map(card).join('');document.getElementById('rr').innerHTML=[...D].reverse().map(card).join('');document.getElementById('tr2').innerHTML=D.map(card).join('');document.getElementById('kr').innerHTML=D.map(card).join('');document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openD(x.dataset.id));};
let openD=id=>{let o=D.find(x=>x.id===id);let el=document.getElementById('det');el.style.display='block';el.innerHTML=`<div style="display:flex;gap:10px"><img src="${o.i}" style="width:64px;height:64px;border-radius:14px"><div><h3>${e(o.n)}</h3><div style="font-size:11px">${e(o.d)}</div></div></div><button style="width:100%;margin-top:8px;background:var(--b);color:#fff;border:0;border-radius:20px;padding:10px" onclick="play('${o.u}','${e(o.n)}')">☁️ Play</button>`;el.scrollIntoView({behavior:'smooth'});};
let play=(u,t)=>{let p=document.getElementById('pl'),f=document.getElementById('fr');p.style.display='block';f.src='about:blank';setTimeout(()=>f.src=u,100);p.scrollIntoView({behavior:'smooth'});};
let go=q=>{let el=document.getElementById('det');el.style.display='block';let f=autoSearch(q); el.innerHTML=`<h3>${f.length} for ${e(q)}</h3><div class="row" style="margin-top:8px">${f.map(card).join('')}</div>`;document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openD(x.dataset.id));el.scrollIntoView({behavior:'smooth'});};
let sug=()=>{let q=document.getElementById('q').value.toLowerCase(),b=document.getElementById('sbx');if(!q){b.style.display='none';return;}let s=autoSearch(q).slice(0,5).map(x=>x.n.toLowerCase());let h=s.map(x=>`<div class="si" data-q="${e(x)}">🔍 ${e(x)}</div>`).join('');b.innerHTML=h;b.style.display='block';b.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{document.getElementById('q').value=x.dataset.q;b.style.display='none';go(x.dataset.q)});};
document.getElementById('tt').querySelectorAll('span').forEach(s=>s.onclick=()=>{document.querySelectorAll('#tt span').forEach(x=>x.classList.remove('on'));s.classList.add('on');let t=s.dataset.t;['for','top','kid','cat'].forEach(id=>document.getElementById(id).style.display=id===t?'block':'none')});
document.querySelectorAll('.b').forEach(b=>b.onclick=()=>{document.querySelectorAll('.b').forEach(x=>x.classList.remove('on'));b.classList.add('on');let n=b.dataset.n;if(n==='games')go('Action');if(n==='search')document.getElementById('q').focus();});
(async()=>{await loadRemote(); initAllSearch(); render(); loadReal();})();
</script></body></html>
