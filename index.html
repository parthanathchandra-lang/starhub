<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarHub IGDP - Play Store Real Copy</title>
<style>
:root{--g:#00b368;--line:#e8eaed;--bg:#fff;--chip:#f1f3f4}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Google Sans,Roboto,Arial;background:#fff;color:#202124}
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-weight:700;font-size:22px;display:flex;gap:6px}.logo b{color:var(--g)}
.search{flex:1;max-width:720px;height:46px;background:#f1f3f4;border-radius:28px;display:flex;align-items:center;padding:0 16px;gap:10px}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:16px}
.pill{padding:6px 12px;border-radius:16px;background:var(--chip);border:1px solid var(--line);font-size:12px;cursor:pointer}
.masonry{column-count:4;column-gap:12px}@media(max-width:1100px){.masonry{column-count:3}}@media(max-width:700px){.masonry{column-count:2}}@media(max-width:480px){.masonry{column-count:1}}
.psBox{break-inside:avoid;border-radius:8px;padding:12px;margin-bottom:12px;cursor:pointer;border:1px solid transparent}
.psBox:hover{background:#f8f9fa;border-color:var(--line)}
.psTop{display:flex;gap:12px}.psIcon{width:56px;height:56px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.psName{font-size:14px;font-weight:500;line-height:1.3}.psMeta{font-size:12px;color:#5f6368;margin-top:2px}
.installBtn{margin-left:auto;background:var(--g);color:#fff;border:0;border-radius:20px;padding:8px 20px;font-weight:500;font-size:14px;cursor:pointer;height:36px;align-self:center}
.whereChip{font-size:11px;background:#e8f0fe;color:#1967d2;padding:3px 8px;border-radius:12px;margin:2px;display:inline-block}
.ytBox{break-inside:avoid;margin-bottom:16px;cursor:pointer}
.ytThumb{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;position:relative;overflow:hidden}
.ytThumb img{width:100%;height:100%;object-fit:cover}
.ytDur{position:absolute;bottom:6px;right:6px;background:#000c;color:#fff;font-size:11px;padding:2px 4px;border-radius:4px}
.ytTitle{font-size:14px;font-weight:500;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ytChan{display:flex;gap:8px;margin-top:6px;align-items:center}.ytChan img{width:36px;height:36px;border-radius:50%}
.iframeBox{width:100%;height:70vh;border:0;background:#000;border-radius:12px}
.note{font-size:12px;color:#5f6368}
#wrap{max-width:1300px;margin:0 auto;padding:16px}
.googlePower{background:#f8f9fa;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
</style>
</head><body>
<header>
<div class="logo"><span style="color:var(--g)">✦</span> starhub</div>
<div class="search">🔍<input id="q" placeholder="Search apps, games, videos - Google style" oninput="render()" onkeydown="if(event.key==='Enter')render()"></div>
<span class="pill" onclick="document.getElementById('q').value='';render()">Clear</span>
</header>
<div id="wrap">
<div id="hype" style="display:flex;gap:8px;overflow:auto;padding:8px 0"></div>
<div id="grid" class="masonry"></div>
<div id="googlePower" class="googlePower" style="display:none"></div>
<div id="detail" style="display:none;margin-top:16px"></div>
<div id="player" style="display:none;margin-top:16px"><iframe id="frame" class="iframeBox" allow="autoplay;fullscreen" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe><div id="info" class="note" style="margin-top:8px"></div></div>
</div>
<script>
let clicks={};try{clicks=JSON.parse(localStorage.getItem('shC')||'{}')}catch{clicks={}}
function save(){try{localStorage.setItem('shC',JSON.stringify(clicks))}catch{}}
let items=[
 {id:'pkm',n:'Pokemon UNITE',dev:'The Pokemon Company',type:'game',platforms:['Android','iOS','PC'],u:'https://now.gg/apps/the-pokemon-company/5947/pokemon-unite.html',size:'5.8 MB',rate:4.6,dl:'100M+',plays:'12M plays',now:'1.8k playing now',hype:99,guide:'Guide • Tactics • Redeem codes'},
 {id:'ff',n:'Free Fire',dev:'Garena International',type:'game',platforms:['Android','PC'],u:'https://now.gg/apps/garena/13982/free-fire.html',size:'5.2 MB',rate:4.5,dl:'500M+',plays:'50M plays',now:'3.2k playing now',hype:98,guide:'Rank push • Sensitivity • Codes today'},
 {id:'rb',n:'Roblox',dev:'Roblox Corporation',type:'game',platforms:['Android','iOS','PC','Console','VR'],u:'https://now.gg/apps/roblox-corporation/5734/roblox.html',size:'6.1 MB',rate:4.7,dl:'1B+',plays:'70M plays',now:'5.1k playing now',hype:97,guide:'Obby guide • Codes • Robux'},
 {id:'v1',n:'How to Play Pokemon UNITE - Full Guide for Beginners',dev:'Pokemon Guides • 2.5M views',type:'video',platforms:['Videos'],u:'https://www.youtube-nocookie.com/embed/8u2T6Pz0C1g?rel=0',dur:'12:34',rate:4.8,guide:'Full guide • How to use skills • Redeem + exchange codes'},
 {id:'v2',n:'Free Fire Redeem Codes Today - All Working Codes',dev:'Gaming Zone • 5M views',type:'video',platforms:['Videos'],u:'https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?rel=0',dur:'8:21',rate:4.9,guide:'Today codes • How to redeem • Exchange codes'}
];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderHype(){
 let h=document.getElementById('hype');if(!h)return;
 let sorted=[...items].map(o=>({...o,c:clicks[o.id]||0})).sort((a,b)=>(b.hype+b.c*2)-(a.hype+a.c*2));
 h.innerHTML=sorted.map((o,i)=>`<span class="pill" style="${i===0?'background:var(--g);color:#fff':''}" data-id="${o.id}">#${i+1} ${esc(o.n)} 🔥</span>`).join('');
 h.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openD(el.dataset.id)));
}
function box(o){
 if(o.type==='video'){
  return `<div class="ytBox" data-id="${o.id}"><div class="ytThumb"><img src="https://picsum.photos/seed/${o.id}/320/180" loading="lazy"><span class="ytDur">${esc(o.dur||'8:21')}</span></div><div class="ytTitle">${esc(o.n)}</div><div class="ytChan"><img src="https://picsum.photos/seed/c${o.id}/40/40"><div><div class="note">${esc(o.dev)}</div><div class="note">${esc(o.guide)} • Where: YouTube Main</div></div></div></div>`;
 }else{
  let where=o.platforms.map(p=>`<span class="whereChip">${esc(p)}</span>`).join('');
  return `<div class="psBox" data-id="${o.id}"><div class="psTop"><img class="psIcon" src="https://picsum.photos/seed/${o.id}/100/100"><div style="flex:1"><div class="psName">${esc(o.n)}</div><div class="psMeta">${esc(o.dev)}</div><div class="psMeta">${o.rate}★ ${esc(o.dl)} • ${esc(o.size)} • ${esc(o.now)}</div><div style="margin-top:6px">${where}</div></div><button class="installBtn">☁️ Play</button></div><div class="note" style="margin-top:8px">${esc(o.guide)} • Powered by now.gg • By StarHub • Alt: Free • P2P 70/30 - Only what user needs</div></div>`;
 }
}
function render(){
 let q=(document.getElementById('q')?.value||'').toLowerCase().trim();
 let g=document.getElementById('grid');let gp=document.getElementById('googlePower');
 let filtered=items.filter(o=>!q||o.n.toLowerCase().includes(q)||o.dev.toLowerCase().includes(q)||o.platforms.join(' ').toLowerCase().includes(q)||o.guide.toLowerCase().includes(q));
 g.innerHTML=filtered.map(box).join('');
 // Google power - if nothing found or new query, show external power results - never blank like Google
 if(filtered.length===0 && q){
  gp.style.display='block';
  gp.innerHTML=`<h4 style="font-size:14px">🔍 Google style results for "${esc(q)}" - Other resource power - Play Store + YouTube + now.gg + Xbox Cloud</h4>
  <div style="margin-top:10px;display:grid;gap:8px">
  <a href="https://play.google.com/store/search?q=${encodeURIComponent(q)}&c=apps" target="_blank" class="pill" style="justify-content:space-between">📱 Play Store - Search ${esc(q)} <span>↗</span></a>
  <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q+' guide redeem codes')}" target="_blank" class="pill" style="justify-content:space-between">▶️ YouTube - ${esc(q)} guide + redeem codes + tactics <span>↗</span></a>
  <a href="https://now.gg/search/${encodeURIComponent(q)}" target="_blank" class="pill" style="justify-content:space-between">☁️ now.gg Cloud - ${esc(q)} cloud play - 0 storage <span>↗</span></a>
  <a href="https://www.xbox.com/en-US/play/search?q=${encodeURIComponent(q)}" target="_blank" class="pill" style="justify-content:space-between">🎮 Xbox Cloud Gaming - ${esc(q)} <span>↗</span></a>
  <a href="https://www.google.com/search?q=${encodeURIComponent(q+' site:play.google.com OR site:youtube.com guide')}" target="_blank" class="pill" style="justify-content:space-between">🔍 Google - More info + other resources for ${esc(q)} <span>↗</span></a>
  </div><div class="note" style="margin-top:8px">Play Store interface suitable - No extra tech info shown - Only user needed - Where inside box - No bar list - Dual ads separate - Shock absorber new tab fallback</div>`;
 }else if(q && filtered.length>0){
  gp.style.display='block';
  gp.innerHTML=`<div class="note">Showing ${filtered.length} results for "${esc(q)}" + Other resources: <a href="https://play.google.com/store/search?q=${encodeURIComponent(q)}" target="_blank">Play Store ↗</a> • <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank">YouTube ↗</a> • <a href="https://now.gg/search/${encodeURIComponent(q)}" target="_blank">now.gg ↗</a></div>`;
 }else{gp.style.display='none';}
 g.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openD(el.dataset.id)));
}
function openD(id){
 let o=items.find(x=>x.id===id);if(!o)return;
 clicks[id]=(clicks[id]||0)+1;save();
 let d=document.getElementById('detail');d.style.display='block';
 if(o.type==='video'){
  d.innerHTML=`<div style="display:flex;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:300px"><div class="ytThumb"><img src="https://picsum.photos/seed/${id}/640/360"></div><h3 style="margin-top:12px">${esc(o.n)}</h3><div class="ytChan"><img src="https://picsum.photos/seed/c${id}/40/40"><div><b>${esc(o.dev)}</b><div class="note">${esc(o.guide)} • Where: YouTube Main + now.gg</div></div><button class="pill" style="margin-left:auto">Subscribe</button></div><div class="note" style="margin-top:12px">Guide / Tactics / Redeem codes / Exchange codes from different platforms - How to play & use video</div></div></div><button class="installBtn" style="margin-top:12px;width:100%;height:44px;border-radius:8px" id="playBtn">▶️ Play Video on StarHub - YouTube-nocookie</button>`;
 }else{
  d.innerHTML=`<div style="display:flex;gap:16px"><img class="psIcon" style="width:72px;height:72px" src="https://picsum.photos/seed/${id}/100/100"><div><h2 style="font-size:22px">${esc(o.n)}</h2><div class="note" style="color:var(--g)">${esc(o.dev)}</div><div class="note">Contains ads • In-app purchases • ${esc(o.dl)} downloads • ${o.rate}★ • ${esc(o.size)} • ${esc(o.now)} • 🔥 Hype ${o.hype+(clicks[id]||0)} • Where: ${o.platforms.join(' / ')} - No bar list</div></div></div><div style="margin-top:16px;display:flex;gap:8px"><button class="installBtn" style="flex:1;height:44px;border-radius:8px;font-size:16px" id="playBtn">☁️ Play on StarHub - 0 storage</button><span class="pill">Share</span><span class="pill">Wishlist</span></div><div style="margin-top:16px"><h4>About this game</h4><p class="note" style="margin-top:6px">${esc(o.guide)} - How to play guide + tactics + redeem codes + exchange codes + how to use. Powered by now.gg small icon - By StarHub UI - Real time plays ${esc(o.now)} - Data safety - Alt Free: ${esc(o.n)} Cloud - P2P 70/30 Host earns - Dust2 Only 2GB not 100GB - Quality 240p/480p/720p/1080p + Data Saver - Other resource power: Play Store + YouTube + Steam + Xbox Cloud + Google.</p><div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">${o.platforms.map(p=>`<span class="whereChip">${esc(p)}</span>`).join('')}</div></div><div style="margin-top:16px"><h4>Ratings and reviews</h4><div class="note">${o.rate}★ - Rating/Review Google info - Open Play Store Reviews - User reviews shown via Play Store link</div><a href="https://play.google.com/store/search?q=${encodeURIComponent(o.n)}" target="_blank" class="pill">📱 Open Play Store Reviews ↗</a></div>`;
 }
 document.getElementById('playBtn')?.addEventListener('click',()=>play(o.u,o.n));
 d.scrollIntoView({behavior:'smooth'});renderHype();
}
function play(u,t){
 let p=document.getElementById('player');let f=document.getElementById('frame');let info=document.getElementById('info');
 if(!p||!f)return;p.style.display='block';
 f.src=u; // youtube-nocookie + now.gg - if blocked auto new tab
 setTimeout(()=>{try{if(f.contentDocument?.body?.innerHTML.length<50)throw 0;}catch{window.open(u,'_blank');if(info)info.innerText='Shock absorber: Provider blocked embed - Opened new tab safe - 0 storage - Powered by '+t;}},3000);
 if(info)info.innerText='Loading '+t+' - Top Platform Ad 5s free if ad seen + Bottom StarHub Ad if available else hidden + speaker separate - Where inside box';
 p.scrollIntoView({behavior:'smooth'});
}
render();renderHype();
</script>
</body></html>
