<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:12px;background:#0b0d10;color:#e8edf2;font:15px system-ui,sans-serif}
input{width:100%;max-width:320px;padding:9px 14px;border-radius:999px;border:1px solid #242b33;background:#15191f;color:#e8edf2;font:inherit;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{flex:none;border:1px solid #242b33;background:#15191f;color:#e8edf2;border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:#00ff88;color:#04140b;border-color:#00ff88}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#15191f;border:1px solid #242b33;border-radius:12px;overflow:hidden;color:#e8edf2;text-decoration:none}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#1d232b}
.card div{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{color:#8b97a3;padding:20px 0;grid-column:1/-1}
h2{font-size:15px;margin:22px 0 8px}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.svc{background:#15191f;border:1px solid #242b33;border-radius:10px;padding:10px;color:#e8edf2;text-decoration:none}
</style>
</head>
<body>

<h1>★ Game Hub</h1>
<input id="search" type="search" placeholder="Search games" aria-label="Search games">
<nav class="chips" id="chips"></nav>
<main class="grid" id="grid"><div class="msg">Loading…</div></main>

<h2>Services</h2>
<div class="svcs" id="svcs"></div>

<script>
const CONFIG = {
  url: "https://tsomtfhynwhjsypojlbn.supabase.co",
  key: "PASTE-YOUR-ANON-KEY-HERE"   // anon key only
};
const SERVICES = [
  ["JioHotstar","https://www.hotstar.com"],["Spotify","https://open.spotify.com"],
  ["Steam","https://store.steampowered.com"],["GitHub","https://github.com"]
];
const $ = id => document.getElementById(id);
const state = { games: [], query: "", category: "All" };

function show(msg) {
  $("grid").replaceChildren(Object.assign(document.createElement("div"), { className: "msg", textContent: msg }));
}

function render() {
  const q = state.query.trim().toLowerCase();
  const list = state.games.filter(g =>
    (state.category === "All" || g.category === state.category) &&
    (!q || g.title.toLowerCase().includes(q))
  );
  if (!list.length) return show(state.games.length ? "No games match." : "No games yet.");

  $("grid").replaceChildren(...list.map(g => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `game.html?slug=${encodeURIComponent(g.slug)}`;
    if (/^https?:\/\//i.test(g.thumbnail_url || "")) {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.src = g.thumbnail_url;
      a.appendChild(img);
    }
    const t = document.createElement("div");
    t.textContent = g.title;
    a.appendChild(t);
    return a;
  }));
}

function renderChips() {
  const cats = ["All", ...new Set(state.games.map(g => g.category).filter(Boolean))];
  $("chips").replaceChildren(...cats.map(c => {
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.textContent = c;
    b.setAttribute("aria-pressed", String(c === state.category));
    b.onclick = () => { state.category = c; renderChips(); render(); };
    return b;
  }));
}

async function load() {
  $("svcs").replaceChildren(...SERVICES.map(([name, href]) => {
    const a = document.createElement("a");
    a.className = "svc";
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = name;
    return a;
  }));

  if (!CONFIG.key || CONFIG.key.startsWith("PASTE-")) {
    return show("Setup needed: add your Supabase anon key in CONFIG.");
  }

  try {
    const client = supabase.createClient(CONFIG.url, CONFIG.key);
    const { data, error } = await client.from("games").select("*").eq("is_active", true).order("title");
    if (error) throw error;
    state.games = data || [];
    renderChips();
    render();
  } catch (err) {
    console.error(err);
    show("Couldn't load games. Please refresh.");
  }
}

$("search").addEventListener("input", e => { state.query = e.target.value; render(); });
load();
</script>
</body>
</html>
