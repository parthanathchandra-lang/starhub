<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>starHub V1 New White</title><style>
:root{--bg:#fff;--card:#f8f9fa;--b:#e8eaed;--cyan:#01875f}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:system-ui;padding:8px}
header{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b);position:sticky;top:0;background:#fff;z-index:10}
.logo{font-weight:900;font-size:20px;color:var(--cyan)}.search{flex:1;background:#f1f3f4;border:0;border-radius:24px;padding:10px 14px;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:10px;text-align:center}
.card img{width:48px;height:48px;margin:0 auto;display:block;background:#fff;border-radius:12px;padding:6px}
.card h3{font-size:11px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-size:10px;padding:6px 10px;border-radius:16px;border:1px solid var(--b);background:#fff;cursor:pointer}.btn.on{border-color:var(--cyan);color:var(--cyan)}
#float{position:fixed;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:var(--cyan);color:#fff;border:none;z-index:999}
#win{position:fixed;right:6px;bottom:64px;width:96%;max-width:400px;max-height:85vh;background:#fff;border:1px solid var(--b);border-radius:16px;display:none;flex-direction:column;z-index:1000}
#win.show{display:flex}.wh{padding:10px;background:#f8f9fa;display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid var(--b);font-size:12px}
.wb{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}textarea{width:100%;min-height:60px;background:#f1f3f4;border:1px solid var(--b);border-radius:8px;padding:6px;font-size:10px}
</style></head><body>
<header><div class="logo">starHub V1 New</div><input id="q" class="search" placeholder="Search..."><button class="btn" onclick="toggleOwner()">👑</button></header>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><button class="btn" id="bData" onclick="tData()">📉 Data OFF</button><button class="btn on" id="bHd" onclick="tHd()">HD HIGH 128px</button><button class="btn on" id="bNet" onclick="tNet()">Net HIGH</button><button class="btn" onclick="addUserShortcut()">➕ My Shortcut</button></div>
<div style="font-size:10px;background:#e6f4ea;border-radius:8px;padding:6px">✓ V1 New White Small=Low Net Clear Home Owner=Global User=Own</div>
<div class="grid" id="grid"></div>
<button id="float">↻</button>
<div id="win"><div class="wh"><span id="winTitle">Update</span><span onclick="closeW()">✕</span></div><div class="wb"><textarea id="paste" placeholder="google.com, youtube.com"></textarea><div style="display:flex;gap:4px"><button class="btn on" style="flex:1" onclick="analyze()">🔍 Auto Fix</button><button class="btn" style="flex:1;background:var(--cyan);color:#fff" onclick="doUpdate()">UPDATE DONE</button></div><div id="log" style="font-size:9px;color:#777">Log: V1 New Ready - Ctrl+Shift+U</div><button class="btn" style="width:100%" onclick="down()">Download index.html</button></div></div>
<script>
let IS_OWNER=localStorage.getItem('is_owner')==='1';let DATA=false,HD='high',NET='high';
let globalItems=JSON.parse(localStorage.getItem('sh_global')||'null')||[{name:'Google',domain:'google.com',url:'https://google.com',owner:true},{name:'YouTube',domain:'youtube.com',url:'https://youtube.com',owner:true},{name:'GitHub',domain:'github.com',url:'https://github.com',owner:true}];
let userItems=JSON.parse(localStorage.getItem('sh_user')||'null')||[];let db=JSON.parse(localStorage.getItem('starHub_prev_new_all')||'null')||{userGallery:[]};
function iconUrl(d){return DATA?`https://www.google.com/s2/favicons?domain=${d}&sz=32`:HD==='high'?`https://www.google.com/s2/favicons?domain=${d}&sz=128`:`https://www.google.com/s2/favicons?domain=${d}&sz=64`;}
function render(){const g=document.getElementById('grid');const q=(document.getElementById('q').value||'').toLowerCase();g.innerHTML='';let all=[...globalItems,...userItems,...db.userGallery];let uniq={};all=all.filter(x=>{let k=x.domain||x.url;if(uniq[k])return false;uniq[k]=1;return true;}).filter(i=>!q||i.name.toLowerCase().includes(q));all.forEach(it=>{let dom=it.domain||'';try{if(!dom)dom=new URL(it.url).hostname}catch(e){dom=it.url} const div=document.createElement('div');div.className='card';div.innerHTML=`<img src="${iconUrl(dom)}" loading="${NET==='low'?'lazy':'eager'}"><h3>${it.name}</h3>`;div.onclick=()=>window.open(it.url||'https://'+dom,'_blank');g.appendChild(div);});document.getElementById('winTitle').textContent=IS_OWNER?'Owner Global=starHub':'User Own Only';}
function toggleOwner(){if(IS_OWNER){IS_OWNER=false;localStorage.setItem('is_owner','0');render();}else{let p=prompt('Password?');if(p==='starhub123'){IS_OWNER=true;localStorage.setItem('is_owner','1');render();}}}
function tData(){DATA=!DATA;document.getElementById('bData').textContent=DATA?'Data ON':'Data OFF';render();}
function tHd(){HD=HD==='high'?'normal':'high';render();}
function tNet(){NET=NET==='high'?'low':'high';render();}
function addUserShortcut(){let d=prompt('Domain?');if(!d)return;let n=prompt('Name?',d.split('.')[0]);userItems.push({name:n||d,domain:d,url:'https://'+d});localStorage.setItem('sh_user',JSON.stringify(userItems));render();}
let pending=[];function analyze(){let raw=document.getElementById('paste').value.trim();if(!raw)return;pending=[];let fixes={'gogle.com':'google.com'};raw.split(/[\n,\s,]+/).forEach(l=>{l=l.trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0];if(!l||!l.includes('.'))return;if(fixes[l])l=fixes[l];pending.push({name:l.split('.')[0],domain:l,url:'https://'+l,owner:IS_OWNER});});document.getElementById('log').innerHTML+='<br>Found '+pending.length;}
function doUpdate(){if(!pending.length)return;if(IS_OWNER){globalItems.push(...pending);localStorage.setItem('sh_global',JSON.stringify(globalItems));}else{userItems.push(...pending);localStorage.setItem('sh_user',JSON.stringify(userItems));}pending=[];render();alert(IS_OWNER?'Global Updated - GitHub Commit':'Own Updated');}
function closeW(){document.getElementById('win').classList.remove('show');}
function down(){let b=new Blob([document.documentElement.outerHTML],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='index.html';a.click();}
document.getElementById('float').onclick=()=>document.getElementById('win').classList.add('show');
document.getElementById('q').addEventListener('input',render);render();
</script></body></html>
