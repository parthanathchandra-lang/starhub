<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0d10;--card:#15191f;--line:#242b33;--text:#e8edf2;--muted:#8b97a3;--acc:#00ff88;--ink:#04140b}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:24px 0 8px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--ink);border-color:var(--acc);font-weight:600}
.acct{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
#auth{display:none;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#auth[data-open]{display:flex}
input{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;max-width:240px;width:100%}
#search{max-width:320px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--text);text-decoration:none;display:block}
.card img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#1d232b}
.ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;font-weight:700}
.card .t{padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{color:var(--muted);padding:20px 0;grid-column:1/-1}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);text-decoration:none;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>★ Game Hub</h1>
  <div class="acct">
    <span id="who"></span>
    <button id="loginBtn" class="btn pri" type="button">Login</button>
    <button id="logoutBtn" class="btn" type="button" hidden>Logout</button>
  </div>
</header>

<form id="auth">
  <input id="email" type="email" placeholder="Email" required autocomplete="email">
  <input id="pass" type="password" placeholder="Password" required minlength="6" autocomplete="current-password">
  <button class="btn pri" type="submit">Login</button>
  <button id="signUp" class="btn" type="button">Sign up</button>
  <p id="authMsg" class="acct"></p>
</form>

<input id="search" type="search" placeholder="Search games">
<nav class="chips" id="chips"></nav>
<main class="grid" id="grid"><div class="msg">Loading...</div></main>

<h2>Mirrors</h2>
<div class="svcs" id="mirrors"></div>

<script>
const $ = id => document.getElementById(id);
const CONFIG = window.SITE_CONFIG;
const client = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
const state = { games: [], query: "", category: "All" };
const SLUG_RE = /^[a-z0-9][a-z0-9-]*$/i;
const isHttp = u => /^https?:\/\//i.test(u || "");

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}
const initial = t => String(t || "?").trim().charAt(0).toUpperCase();
const showMsg = text => $("grid").replaceChildren(el("div", { className: "msg", textContent: text }));
const setAuthMsg = text => { $("authMsg").textContent = text; };

function render() {
  if (!state.games.length) return showMsg("No games yet.");
  const q = state.query.trim().toLowerCase();
  const list = state.games.filter(g =>
    (state.category === "All" || g.category === state.category) &&
    (!q || String(g.title).toLowerCase().includes(q)));
  if (!list.length) return showMsg("No games match.");

  $("grid").replaceChildren(...list.map(g => {
    const card = el("a", { className: "card", href: `game.html?slug=${encodeURIComponent(g.slug)}` });
    if (isHttp(g.thumbnail_url)) {
      const img = el("img", { src: g.thumbnail_url, alt: "", loading: "lazy" });
      img.onerror = () => img.replaceWith(el("div", { className: "ph", textContent: initial(g.title) }));
      card.append(img);
    } else {
      card.append(el("div", { className: "ph", textContent: initial(g.title) }));
    }
    card.append(el("div", { className: "t", textContent: g.title }));
    return card;
  }));
}

function renderChips() {
  const cats = ["All", ...new Set(state.games.map(g => g.category).filter(Boolean))];
  $("chips").replaceChildren(...cats.map(c => {
    const b = el("button", { className: "chip", type: "button", textContent: c });
    b.setAttribute("aria-pressed", String(c === state.category));
    b.onclick = () => { state.category = c; renderChips(); render(); };
    return b;
  }));
}

// Data Supabase se aata hai, isliye har mirror domain par same data milta hai.
async function loadGames(attempt = 1) {
  try {
    const { data, error } = await client.from("games")
      .select("id,title,slug,thumbnail_url,category")
      .eq("is_active", true)
      .order("title");
    if (error) throw error;
    state.games = (data || []).filter(g => g && SLUG_RE.test(String(g.slug || "")));
    renderChips();
    render();
  } catch (e) {
    console.warn("loadGames attempt", attempt, e);
    if (attempt < 3) {
      await new Promise(r => setTimeout(r, 800 * attempt));
      return loadGames(attempt + 1);
    }
    showMsg("Couldn't load games. Connection ya Supabase RLS policy check karo.");
  }
}

// no-cors: CORS header ke bina bhi reachability check ho jati hai.
async function checkMirror(url) {
  const t0 = performance.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: ctl.signal });
    return { ok: true, ms: Math.round(performance.now() - t0) };
  } catch {
    return { ok: false };
  } finally {
    clearTimeout(timer);
  }
}

async function renderMirrors() {
  const here = location.origin;
  const rows = await Promise.all(CONFIG.mirrors.map(async url => {
    const s = await checkMirror(url);
    const host = new URL(url).hostname;
    const label = `${s.ok ? "🟢" : "🔴"} ${host}${s.ok ? ` (${s.ms}ms)` : ""}${url === here ? " — this" : ""}`;
    return el("a", { className: "svc", href: url, target: "_blank", rel: "noopener", textContent: label });
  }));
  $("mirrors").replaceChildren(...rows);
}

async function init() {
  const { data } = await client.auth.getSession();
  const user = data?.session?.user;
  $("who").textContent = user?.email || "";
  $("loginBtn").hidden = !!user;
  $("logoutBtn").hidden = !user;
  client.auth.onAuthStateChange((_e, s) => {
    $("who").textContent = s?.user?.email || "";
    $("loginBtn").hidden = !!s?.user;
    $("logoutBtn").hidden = !s?.user;
  });
  renderMirrors();
  loadGames();
}

$("loginBtn").onclick = () => $("auth").toggleAttribute("data-open");
$("auth").onsubmit = async e => {
  e.preventDefault();
  setAuthMsg("Logging in...");
  const { error } = await client.auth.signInWithPassword({
    email: $("email").value.trim(), password: $("pass").value
  });
  setAuthMsg(error ? error.message : "");
};
$("signUp").onclick = async () => {
  setAuthMsg("Creating...");
  const { data, error } = await client.auth.signUp({
    email: $("email").value.trim(), password: $("pass").value
  });
  setAuthMsg(error ? error.message : (data.session ? "" : "Email confirm karo"));
};
$("logoutBtn").onclick = () => client.auth.signOut();
$("search").oninput = e => { state.query = e.target.value; render(); };

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

init();
</script>
</body>
</html>
