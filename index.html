document.addEventListener("click", async e => {
  const t = e.target;
  let el;
  if (!t.closest("#menu") && !t.closest("#profBtn")) toggleMenu(false);

  if (el = t.closest("[data-tab]")) { S.tab = el.dataset.tab; renderTabs(); if (S.q) search(S.q); return; }
  if (el = t.closest("[data-cat]")) { S.cat = el.dataset.cat; paintHome(); return; }
  if (el = t.closest("[data-prof]")) { setProfile(el.dataset.prof); return; }
  if (t.closest("[data-add-prof]")) { addProfile(); return; }
  if (t.closest("[data-del-prof]")) { removeProfile(); return; }
  if (el = t.closest("[data-view]")) {
    const v = el.dataset.view;
    if (v === "profile") { toggleMenu(); return; }
    if (v === "home") { show("home"); paintHome(); }
    if (v === "saved") showSaved();
    if (v === "history") showHistory();
    return;
  }
  if (el = t.closest("[data-q]")) { $("q").value = el.dataset.q; search(el.dataset.q); return; }
  if (t.closest("[data-clear-hist]")) { hist = []; sv(K("hist"), hist); showHistory(); toast("History cleared - Hash only - No PII - DPDP - Past Present Future safe"); return; }
  if (t.closest("#more")) { search(S.q, true); return; }
  if (t.closest("[data-retry]")) { search(S.q); return; }

  if (el = t.closest("[data-act]")) {
    const it = S.items[+el.dataset.i]; if (!it) return;
    if (el.dataset.act === "save") { toggleSave(it); return; }
    if (el.dataset.act === "info") { openSheet(it); return; }
    if (el.dataset.act === "play") {
      const id = ytIdOf(it.url);
      if (id) location.href = "/watch/?v=" + id;
      else window.open(safeUrl(it.url) || "about:blank", "_blank", "noopener");
      return;
    }
  }
  if (el = t.closest("[data-i]")) { const it = S.items[+el.dataset.i]; if (it) openSheet(it); return; }

  if (t.id === "sheet") { closeSheet(); return; }
  if (t.closest("#shSave")) { toggleSave(S.sheet); if (S.sheet) openSheet(S.sheet); return; }
  if (t.closest("#shCopy")) { const ok = S.sheet && await copyText(safeUrl(S.sheet.url) || ""); toast(ok ? "Link copied - Hash only - No PII - Past Present Future safe" : "Could not copy - Akela OK"); return; }
  if (t.closest("#shShare")) {
    if (navigator.share && S.sheet) navigator.share({ title: S.sheet.title, url: safeUrl(S.sheet.url) || undefined }).catch(() => {});
    else { const ok = S.sheet && await copyText(safeUrl(S.sheet.url) || ""); toast(ok ? "Link copied - Akela + Sath - Valid" : "Could not copy - Akela OK"); }
  }
});
