name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Set target environment
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "TARGET=production" >> "$GITHUB_ENV"
          else
            echo "TARGET=preview" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: |
          if [ "$TARGET" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Health check (production only)
        if: env.TARGET == 'production'
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 -o /dev/null "${{ steps.deploy.outputs.url }}"